  <script>
  /* ======== 404 倒计时自动返回首页 ======== */
  (function () {
    var left = 10, timer = null;
    var el = document.getElementById('nfCount');
    var cancelBtn = document.getElementById('nfCancel');
    if (!el) return;

    function stop() {
      clearInterval(timer);
      timer = null;
      var box = document.querySelector('.not-found-countdown');
      if (box) box.textContent = '已取消自动跳转';
    }

    timer = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(timer);
        window.location.href = 'index.html';
        return;
      }
      el.textContent = left;
    }, 1000);

    // 点「留在此页」或点任意导航链接，都取消自动跳转
    if (cancelBtn) cancelBtn.addEventListener('click', stop);
    document.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.not-found-links, .not-found-btn')) stop();
    });
  })();
  </script>
