<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='56' font-size='56'>🚀</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=25062715" />
  <style>
    .not-found-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f2e;
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 40px 24px;
    }
    .not-found-code {
      font-size: clamp(80px, 18vw, 160px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #6c5ce7, #00cec9, #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .not-found-title {
      font-size: 24px;
      font-weight: 700;
      color: #f0f2ff;
      margin-bottom: 10px;
    }
    .not-found-desc {
      color: #8a96c0;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 36px;
    }
    .not-found-btn {
      display: inline-block;
      padding: 14px 48px;
      background: linear-gradient(135deg, #6c5ce7, #fd79a8);
      color: #fff;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.3s;
    }
    .not-found-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(108,92,231,0.4);
    }
    .not-found-links {
      margin-top: 24px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .not-found-links a {
      color: #8a96c0;
      font-size: 13px;
      text-decoration: none;
      transition: color .3s;
    }
    .not-found-links a:hover { color: #00cec9; }
  </style>
</head>
<body class="not-found-page">

  <div>
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">页面走丢了</h1>
